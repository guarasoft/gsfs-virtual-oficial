name: Deploy GitHub Pages

# Publica o simulador (app/) no GitHub Pages a cada push na main.
# Requisito único: em Settings → Pages, definir Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências
        working-directory: app
        run: npm ci

      - name: Testes
        working-directory: app
        run: npm test

      - name: Build (base = /<nome-do-repositório>/)
        working-directory: app
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Fallback SPA (rotas do React Router em refresh/link direto)
        run: cp app/dist/index.html app/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
